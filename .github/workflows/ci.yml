# PCH CI: build + full ctest + docs/drift checks on every push and pull request.
# Official actions only, pinned by commit SHA; read-only token.
# Directed by JaydeeWetwork. Built by Cortana.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs + upstream drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: check_docs
        run: python tools/check_docs.py
      - name: upstream drift (offline)
        run: python tools/check_upstream_drift.py

  build-test:
    name: ${{ matrix.os }} ${{ matrix.config }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        config: [Release, Debug]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python }}
      - name: Python deps (no torch, no weights; model beds skip with 77)
        run: python -m pip install "cryptography>=44" psutil
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl-dev libwayland-dev libxkbcommon-dev \
            wayland-protocols pkg-config
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DPCH_BUILD_ENGINE=ON -DPCH_BUILD_TESTBEDS=ON
          -DPython3_EXECUTABLE="${{ steps.py.outputs.python-path }}"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DPCH_BUILD_ENGINE=ON -DPCH_BUILD_TESTBEDS=ON
          -DPython3_EXECUTABLE="${{ steps.py.outputs.python-path }}"
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4
      - name: ctest
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --timeout 1800 -j 4
